<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AREUM — Clinic Login</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0A09'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='32' fill='%23D8BE8E' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/areum-admin.webmanifest">
<link rel="apple-touch-icon" href="/admin-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AREUM Admin">
<meta name="theme-color" content="#0B0A09">
<style>
  @font-face { font-family: 'Playfair Display'; src: url('/fonts/playfair-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Jost'; src: url('/fonts/jost-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: #0B0A09; color: #F4EFE6;
    font-family: 'Jost', sans-serif; padding: 1.5rem;
  }
  .card { width: min(360px, 100%); text-align: center; }
  .brand { font-family: 'Playfair Display', serif; font-size: 2rem; letter-spacing: 0.35em; margin-bottom: 0.4rem; }
  .sub { font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: #B3935F; margin-bottom: 2.4rem; }
  label { display: block; text-align: left; font-size: 0.65rem; letter-spacing: 0.26em; text-transform: uppercase; color: #D8BE8E; margin: 1.1rem 0 0.4rem; }
  input {
    width: 100%; padding: 0.85em 1em; font: inherit; color: inherit;
    background: transparent; border: 1px solid rgba(216,190,142,0.35); border-radius: 8px;
  }
  input:focus { outline: none; border-color: #B3935F; }
  button {
    width: 100%; margin-top: 1.6rem; padding: 0.95em; font: inherit;
    letter-spacing: 0.22em; text-transform: uppercase; font-size: 0.78rem;
    background: #B3935F; color: #0B0A09; border: 0; border-radius: 999px; cursor: pointer;
  }
  button:hover { background: #D8BE8E; }
  .err { color: #E08A74; font-size: 0.85rem; margin-top: 1rem; min-height: 1.2em; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">AREUM</div>
    <div class="sub">Clinic Dashboard</div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
    <p class="err" id="err"></p>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    try {
      const res = await fetch('/admin/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('u').value.trim(),
          password: document.getElementById('p').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || 'Could not sign in'; return; }
      location.reload();
    } catch { err.textContent = 'Connection problem — try again'; }
  });
</script>
</body>
</html>
